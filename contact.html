
<!DOCTYPE html>

  <!-- WeChat popup styles -->
  <style>

    /* WeChat icon */

    .wechat-trigger {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      margin: 0;

      border: none;
      background: transparent;

      cursor: pointer;
    }

    .wechat-trigger svg {
      display: block;
      width: 54px;
      height: 54px;

      transition: transform 0.2s ease,
                  opacity 0.2s ease;
    }

    .wechat-trigger:hover svg {
      transform: scale(1.08);
      opacity: 0.85;
    }

    .wechat-trigger:focus-visible {
      outline: 2px solid #07c160;
      outline-offset: 5px;
      border-radius: 6px;
    }


    /* WeChat popup */

    .wechat-modal {
      position: fixed;

      width: min(360px, calc(100% - 40px));
      max-width: 360px;
      max-height: calc(100% - 40px);

      padding: 32px 24px 28px;

      margin: auto;

      background: #ffffff;

      border: none;
      border-radius: 14px;

      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);

      text-align: center;

      box-sizing: border-box;
    }

    .wechat-modal::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }


    /* Close button */

    .wechat-close {
      position: absolute;

      top: 12px;
      right: 16px;

      padding: 4px 8px;

      border: none;
      background: transparent;

      color: #777777;
      font-size: 28px;
      font-weight: 300;
      line-height: 1;

      cursor: pointer;

      transition: color 0.2s ease;
    }

    .wechat-close:hover {
      color: #222222;
    }


    /* Popup content */

    .wechat-modal h3 {
      margin: 0 0 8px;

      color: #222222;
      font-size: 23px;
      font-weight: 600;
    }

    .wechat-description {
      margin: 0 0 22px;

      color: #777777;
      font-size: 14px;
      line-height: 1.5;
    }


    /* QR code */

    .wechat-qr {
      display: block;

      width: 100%;
      max-width: 260px;
      height: auto;

      margin: 0 auto;

      border-radius: 5px;
    }


    /* Footer */

    .wechat-footer {
      margin: 18px 0 0;

      color: #555555;
      font-size: 14px;
      line-height: 1.5;
    }

    .wechat-footer span {
      color: #07c160;
      font-weight: 500;
    }


    /* Mobile */

    @media (max-width: 480px) {

      .wechat-modal {
        padding: 30px 20px 24px;
      }

      .wechat-qr {
        max-width: 230px;
      }

    }

  </style>

</head>

  <!-- WeChat QR code popup -->

  <dialog

    id="wechatModal"

    <!-- Close button -->

  <!-- WeChat popup JavaScript -->

  <script>

    const wechatButton =
      document.getElementById("wechatButton");

    const wechatModal =
      document.getElementById("wechatModal");

    const wechatClose =
      document.getElementById("wechatClose");


    // Open QR code popup

    wechatButton.addEventListener("click", function () {

      wechatModal.showModal();

    });


    // Close popup

    wechatClose.addEventListener("click", function () {

      wechatModal.close();

      wechatButton.focus();

    });


    // Close when clicking outside the popup

    wechatModal.addEventListener("click", function (event) {

      if (event.target === wechatModal) {

        const rect = wechatModal.getBoundingClientRect();

        const clickedInside = (
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom
        );

        if (!clickedInside) {

          wechatModal.close();

        }

      }

    });


    // Restore keyboard focus after closing

    wechatModal.addEventListener("close", function () {

      wechatButton.focus();

    });

  </script>
