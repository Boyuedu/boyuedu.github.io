<!DOCTYPE html>
<html lang="en" class="page-contact">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Contact Boyue Du — send a message or connect on GitHub, LinkedIn, Google Scholar, and WeChat."
  />

  <title>Contact | Boyue Du</title>

  <link rel="stylesheet" href="assets/css/main.css">

  <style>
    /* =========================
       WeChat Button
    ========================== */

    .wechat-trigger {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      margin: 0;

      border: none;
      background: transparent;

      cursor: pointer;
    }

    .wechat-trigger img {
      display: block;

      width: 54px;
      height: 54px;

      object-fit: contain;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .wechat-trigger:hover img {
      transform: scale(1.08);
      opacity: 0.85;
    }

    .wechat-trigger:focus-visible {
      outline: 2px solid #07c160;
      outline-offset: 5px;
      border-radius: 6px;
    }


    /* =========================
       WeChat Modal
    ========================== */

    .wechat-modal {
      width: min(360px, calc(100% - 40px));
      max-width: 360px;

      padding: 32px 24px 28px;

      border: none;
      border-radius: 14px;

      background: #ffffff;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.18);

      text-align: center;

      box-sizing: border-box;
    }

    .wechat-modal::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }


    /* =========================
       Close Button
    ========================== */

    .wechat-close {
      position: absolute;

      top: 12px;
      right: 15px;

      padding: 4px 8px;

      border: none;
      background: transparent;

      color: #777;

      font-size: 28px;
      font-weight: 300;
      line-height: 1;

      cursor: pointer;

      transition: color 0.2s ease;
    }

    .wechat-close:hover {
      color: #222;
    }


    /* =========================
       Modal Text
    ========================== */

    .wechat-modal h3 {
      margin: 0 0 8px;

      color: #222;

      font-size: 23px;
      font-weight: 600;
    }

    .wechat-description {
      margin: 0 0 22px;

      color: #777;

      font-size: 14px;
      line-height: 1.5;
    }


    /* =========================
       QR Code
    ========================== */

    .wechat-qr {
      display: block;

      width: 100%;
      max-width: 260px;
      height: auto;

      margin: 0 auto;

      border-radius: 6px;
    }


    /* =========================
       Modal Footer
    ========================== */

    .wechat-footer {
      margin: 18px 0 0;

      color: #555;

      font-size: 14px;
      line-height: 1.5;
    }


    /* =========================
       Mobile
    ========================== */

    @media (max-width: 480px) {

      .wechat-modal {
        padding: 30px 20px 24px;
      }

      .wechat-qr {
        max-width: 230px;
      }

      .wechat-trigger img {
        width: 50px;
        height: 50px;
      }
    }
  </style>

</head>


<body>

  <!-- =========================
       Navigation
  ========================== -->

  <nav>

    <div class="brand">
      Boyue Du
    </div>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="about.html">
        About
      </a>

      <a href="education.html">
        Education
      </a>

      <a href="experience.html">
        Experience
      </a>

      <a href="projects.html">
        Research & Projects
      </a>

      <a href="gallery.html">
        Gallery
      </a>

      <a href="contact.html">
        Contact
      </a>

    </div>

  </nav>


  <!-- =========================
       Contact Section
  ========================== -->

  <div class="container">

    <h2>
      Contact
    </h2>


    <div class="contact-wrapper">


      <!-- =========================
           Contact Form
      ========================== -->

      <form
        class="contact-form"
        action="https://formspree.io/f/xanjbldy"
        method="POST"
        id="contactForm"
      >

        <input
          type="text"
          name="name"
          placeholder="Your Name"
          required
        />

        <input
          type="email"
          name="_replyto"
          placeholder="Your Email"
          required
        />

        <input
          type="text"
          name="subject"
          placeholder="Subject"
          required
        />

        <textarea
          name="message"
          placeholder="Your Message"
          required
        ></textarea>


        <!-- Spam Protection -->

        <input
          type="text"
          name="_gotcha"
          class="hp-field"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
        />


        <button type="submit">
          Send
        </button>

      </form>


      <!-- =========================
           Social Links
      ========================== -->

      <div class="button-links">


        <!-- GitHub -->

        <a
          class="icon-link"
          href="https://github.com/Boyuedu"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="assets/img/icons/github_mark.png"
            alt="GitHub profile"
            title="Visit my GitHub"
          />

        </a>


        <!-- LinkedIn -->

        <a
          class="icon-link"
          href="https://www.linkedin.com/in/boyue-du-9b80a4247"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="assets/img/icons/LI-In-Bug.png"
            alt="LinkedIn profile"
            title="Connect on LinkedIn"
          />

        </a>


        <!-- Google Scholar -->

        <a
          class="icon-link"
          href="https://scholar.google.com/citations?user=BjeS0oYAAAAJ"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="assets/img/icons/google_scholar.png"
            alt="Google Scholar profile"
            title="View my Google Scholar"
          />

        </a>


        <!-- WeChat -->

        <button
          type="button"
          class="icon-link wechat-trigger"
          id="wechatButton"

          aria-label="Show my WeChat QR code"
          aria-haspopup="dialog"
          aria-controls="wechatModal"

          title="Connect on WeChat"
        >

          <img
            src="assets/img/icons/wechat.png"
            alt="WeChat"
          />

        </button>


      </div>

    </div>


    <!-- =========================
         Success Message
    ========================== -->

    <p
      class="success-message"
      id="successMessage"
    >
      ✔ Your message has been sent successfully!
    </p>


    <!-- =========================
         Bottom Note
    ========================== -->

    <p class="note">

      <em>
        Feel free to contact me any time!
      </em>

    </p>

  </div>



  <!-- =========================
       WeChat QR Code Modal
  ========================== -->

  <dialog
    class="wechat-modal"
    id="wechatModal"

    aria-labelledby="wechatTitle"
    aria-describedby="wechatDescription"
  >


    <!-- Close Button -->

    <button
      type="button"
      class="wechat-close"
      id="wechatClose"

      aria-label="Close WeChat QR code"
    >

      &times;

    </button>


    <!-- Title -->

    <h3 id="wechatTitle">

      Connect on WeChat

    </h3>


    <!-- Description -->

    <p
      class="wechat-description"
      id="wechatDescription"
    >

      Scan the QR code to connect with me.

    </p>


    <!-- QR Code -->

    <img
      class="wechat-qr"

      src="assets/img/icons/wechat_qr.png"

      alt="Boyue Du's WeChat QR code"
    />


    <!-- Footer -->

    <p class="wechat-footer">

      Looking forward to connecting with you!

    </p>


  </dialog>



  <!-- =========================
       Existing JavaScript
  ========================== -->

  <script src="assets/js/main.js"></script>



  <!-- =========================
       WeChat Modal JavaScript
  ========================== -->

  <script>

    const wechatButton =
      document.getElementById("wechatButton");

    const wechatModal =
      document.getElementById("wechatModal");

    const wechatClose =
      document.getElementById("wechatClose");


    /*
     * Open modal
     */

    wechatButton.addEventListener(
      "click",
      function () {

        wechatModal.showModal();

      }
    );


    /*
     * Close modal using X
     */

    wechatClose.addEventListener(
      "click",
      function () {

        wechatModal.close();

      }
    );


    /*
     * Close modal when clicking
     * outside the popup
     */

    wechatModal.addEventListener(
      "click",
      function (event) {

        const rect =
          wechatModal.getBoundingClientRect();


        const clickedInside =
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom;


        if (!clickedInside) {

          wechatModal.close();

        }

      }
    );


    /*
     * Return keyboard focus
     * to WeChat button
     */

    wechatModal.addEventListener(
      "close",
      function () {

        wechatButton.focus();

      }
    );

  </script>


</body>

</html>
