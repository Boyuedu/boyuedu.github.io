<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact | Boyue Du</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #2f3840;
      color: #fff;
      line-height: 1.6;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #347fda;
      padding: 1em 2em;
    }

    .brand {
      font-weight: bold;
      font-size: 1.2em;
      color: white;
    }

    .nav-links a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-size: 1em;
    }

    .container {
      max-width: 600px;
      margin: 3em auto;
      background: #2f3840;
      padding: 2em;
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
      font-size: 1em;
    }

    input[type="submit"] {
      background-color: transparent;
      color: #fff;
      border: 1px solid #fff;
      cursor: pointer;
      transition: 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #fff;
      color: #2f3840;
    }

    .captcha {
      font-style: italic;
      background-color: white;
      color: black;
      display: inline-block;
      padding: 2px 10px;
      margin-top: 10px;
    }

    .captcha-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <nav>
    <div class="brand">Boyue Du</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="education.html">Education</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html">Projects</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="container">
    <h2>Send Me a Message</h2>
    <!-- Use Formspree, Netlify, or backend handler -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <textarea name="message" rows="6" placeholder="Message" required></textarea>

      <div class="captcha-container">
        <div class="captcha">D F 7 N</div>
        <input type="text" name="captcha" placeholder="Enter the letters above" required />
      </div>

      <input type="submit" value="Send" />
    </form>
  </div>
</body>
</html>
