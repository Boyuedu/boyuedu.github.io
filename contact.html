<!DOCTYPE html>
<html lang="en" class="page-contact">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Boyue Du — send a message or connect on GitHub, LinkedIn, and Google Scholar." />
  <title>Contact | Boyue Du</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <nav>
    <div class="brand">Boyue Du</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="education.html">Education</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html">Research & Projects</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="container">
    <h2>Contact</h2>
    <div class="contact-wrapper">
      <form class="contact-form" action="https://formspree.io/f/xanjbldy" method="POST" id="contactForm">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="_replyto" placeholder="Your Email" required />
        <input type="text" name="subject" placeholder="Subject" required />
        <textarea name="message" placeholder="Your Message" required></textarea>
        <input type="text" name="_gotcha" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button type="submit">Send</button>
      </form>

      <div class="button-links">
        <a class="icon-link" href="https://github.com/Boyuedu" target="_blank" rel="noopener noreferrer">
          <img src="assets/img/icons/github_mark.png" alt="GitHub profile" title="Visit my GitHub" />
        </a>

        <a class="icon-link" href="https://www.linkedin.com/in/boyue-du-9b80a4247" target="_blank" rel="noopener noreferrer">
          <img src="assets/img/icons/LI-In-Bug.png" alt="LinkedIn profile" title="Connect on LinkedIn" />
        </a>

        <a class="icon-link" href="https://scholar.google.com/citations?user=BjeS0oYAAAAJ" target="_blank" rel="noopener noreferrer">
          <img src="assets/img/icons/google_scholar.png" alt="Google Scholar profile" title="View my Google Scholar" />
        </a>
      </div>
    </div>

    <p class="success-message" id="successMessage">✔ Your message has been sent successfully!</p>
    <p class="note"><em>Feel free to contact me any time!</em></p>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
