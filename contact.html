<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact | Boyue Du</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-xX2hFx92UvUfnJliAGkCSr5Bzmq+N3Ru+vOdcchNRiF3Mxz1YkUl9cUNilHd+VpQtiNDSy8+KSMR+Db1rnpO8w==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f9f9f9;
      line-height: 1.6;
      color: #000;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #347fda;
      padding: 1em 2em;
      border-bottom: 1px solid #ccc;
    }

    .brand {
      font-weight: bold;
      font-size: 1.2em;
      color: white;
    }

    .nav-links a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-size: 1em;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 2em;
    }

    h2 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 0.2em;
      margin-top: 1em;
      text-align: center;
    }

    .contact-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 40px;
      margin-top: 2em;
    }

    .contact-form {
      flex: 1;
      min-width: 280px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
    }

    .contact-form textarea {
      height: 140px;
      resize: vertical;
    }

    .contact-form button {
      padding: 10px 20px;
      background-color: #347fda;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
    }

    .contact-form button:hover {
      background-color: #245bb5;
    }

    .button-links {
      flex: 0 0 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 10px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px;
      padding: 10px 20px;
      background-color: #60a5fa;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95em;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn-link i {
      font-size: 1.1em;
    }

    .btn-link:hover {
      background-color: #3b82f6;
      transform: scale(1.05);
    }

    .note {
      text-align: center;
      margin-top: 2em;
      font-size: 1.2em;
      font-weight: 500;
      color: #333;
    }

    .success-message {
      display: none;
      color: green;
      font-weight: bold;
      text-align: center;
      margin-top: 1em;
    }
  </style>
</head>
<body>
  <nav>
    <div class="brand">Boyue Du</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="education.html">Education</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html">Projects</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="container">
    <h2>Contact</h2>
    <div class="contact-wrapper">
      <!-- Contact Form -->
      <form class="contact-form" action="https://formspree.io/f/xanjbldy" method="POST" id="contactForm">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="_replyto" placeholder="Your Email" required />
        <input type="text" name="subject" placeholder="Subject" required />
        <textarea name="message" placeholder="Your Message" required></textarea>
        <button type="submit">Send</button>
      </form>

      <!-- Social Links -->
      <div class="button-links">
        <a class="btn-link" href="https://github.com/Boyuedu" target="_blank">
          <i class="fab fa-github"></i> GitHub
        </a>
        <a class="btn-link" href="https://www.linkedin.com/in/david-du-9b80a4247/" target="_blank">
          <i class="fab fa-linkedin"></i> LinkedIn
        </a>
      </div>
    </div>

    <p class="success-message" id="successMessage">✔ Your message has been sent successfully!</p>
    <p class="note"><em>Feel free to contact me any time!</em></p>
  </div>

  <script>
    // Show success message after form submission
    const form = document.getElementById('contactForm');
    const successMsg = document.getElementById('successMessage');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: form.method,
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      });

      if (response.ok) {
        form.reset();
        successMsg.style.display = 'block';
      } else {
        alert('There was a problem submitting the form. Please try again.');
      }
    });
  </script>
</body>
</html>
