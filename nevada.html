<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nevada | State Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: white;
      margin: 0;
      padding: 2em;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 1em;
      color: #38bdf8;
    }

    .description {
      font-family: 'Inter', sans-serif;
      font-size: 1.1em;
      max-width: 800px;
      margin: 0 auto 2em auto;
      color: #cbd5e1;
      line-height: 1.8;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2em;
      justify-content: center;
    }

    .grid img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #334155;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px #38bdf8;
    }

    /* Modal for zoom */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      padding-top: 5%;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 85vh;
      border-radius: 10px;
      box-shadow: 0 0 30px #38bdf8;
      cursor: zoom-out;
    }

    .back-link {
      margin-top: 2em;
      font-family: 'Inter', sans-serif;
      font-size: 1em;
      display: inline-block;
      color: #60a5fa;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Nevada</h1>

  <div class="description">
    This collection captures moments and landscapes across Nevada during my road trip. Double-click any photo to see it enlarged.
  </div>

  <div class="grid">
    <img src="landscape_photos/landscape17.jpg" alt="Nevada Photo 1">
    <!-- Add more Nevada-specific photos -->
  </div>

  <!-- Modal Zoom Viewer -->
  <div id="modal" class="modal" onclick="closeModal()">
    <img id="modal-img" class="modal-content" alt="Zoomed Photo">
  </div>

  <a class="back-link" href="landscape.html">← Back to Landscape Gallery</a>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modal-img");

    document.querySelectorAll('.grid img').forEach(img => {
      img.ondblclick = () => {
        modal.style.display = "block";
        modalImg.src = img.src;
      };
    });

    function closeModal() {
      modal.style.display = "none";
    }
  </script>
</body>
</html>
