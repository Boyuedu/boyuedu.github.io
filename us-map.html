<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive U.S. Map | Boyue Du</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha512-sA+z0pLV2w3PIYv28NdFiO/oM9f1ldQRnSY9p1z1A8+GxI0EeOTFQjUePf0RiN2Fc9PM1xIuZbiO9Uzkf+QAeQ==" crossorigin="" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f172a;
    }

    #us-map {
      height: 100%;
      width: 100%;
    }

    .leaflet-container {
      font-family: 'Arial', sans-serif;
    }
  </style>
</head>
<body>

<div id="us-map"></div>

<!-- Leaflet.js -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha512-Gf94YMaTH6UXT6HK0+/BpiAoLgC4KkN3f3R0I6+iB4Wa/EO5t+yw4jPf07GjpiqY6w+Aoer97T0qzjViU7F9NA==" crossorigin=""></script>

<script>
  const map = L.map('us-map').setView([39.5, -98.35], 4); // Center of the US

  // Add OpenStreetMap tile layer (with attribution)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'
  }).addTo(map);

  // Load public GeoJSON for US states
  fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: {
          color: '#1e3a8a',
          weight: 1,
          fillColor: '#38bdf8',
          fillOpacity: 0.4
        },
        onEachFeature: (feature, layer) => {
          layer.on('mouseover', function () {
            this.setStyle({ fillOpacity: 0.7 });
          });
          layer.on('mouseout', function () {
            this.setStyle({ fillOpacity: 0.4 });
          });
          layer.on('click', function () {
            const state = feature.properties.name.toLowerCase().replace(/ /g, '-');
            window.location.href = `${state}.html`; // e.g., california.html
          });
          layer.bindTooltip(feature.properties.name);
        }
      }).addTo(map);
    });
</script>

</body>
</html>
