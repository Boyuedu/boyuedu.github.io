<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive U.S. Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #0f172a;
    }

    #us-map {
      height: 100%;
      width: 100%;
    }

    .leaflet-container {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>

<div id="us-map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('us-map').setView([39.5, -98.35], 4);

  // Add OpenStreetMap tiles with required attribution
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>'
  }).addTo(map);

  // Load GeoJSON data for US states
  fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: {
          color: '#38bdf8',
          weight: 1,
          fillColor: '#1e3a8a',
          fillOpacity: 0.5
        },
        onEachFeature: (feature, layer) => {
          layer.bindTooltip(feature.properties.name);
          layer.on('click', function () {
            const state = feature.properties.name.toLowerCase().replace(/ /g, '-');
            window.location.href = `${state}.html`;  // e.g., california.html
          });
          layer.on('mouseover', function () {
            this.setStyle({ fillOpacity: 0.7 });
          });
          layer.on('mouseout', function () {
            this.setStyle({ fillOpacity: 0.5 });
          });
        }
      }).addTo(map);
    });
</script>
</body>
</html>
