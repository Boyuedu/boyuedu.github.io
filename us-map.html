<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #0f172a;
    }

    svg {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .region:hover {
      fill: #38bdf8 !important;
      transition: 0.3s;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
    <!-- WEST -->
    <a href="west.html">
      <rect x="50" y="150" width="180" height="250" fill="#1e293b" class="region"/>
      <text x="90" y="280" font-size="24" fill="#fff">WEST</text>
    </a>

    <!-- MIDWEST -->
    <a href="midwest.html">
      <rect x="260" y="130" width="180" height="250" fill="#1e293b" class="region"/>
      <text x="290" y="260" font-size="24" fill="#fff">MIDWEST</text>
    </a>

    <!-- SOUTH -->
    <a href="south.html">
      <rect x="470" y="270" width="180" height="180" fill="#1e293b" class="region"/>
      <text x="510" y="360" font-size="24" fill="#fff">SOUTH</text>
    </a>

    <!-- EAST -->
    <a href="east.html">
      <rect x="660" y="140" width="180" height="240" fill="#1e293b" class="region"/>
      <text x="700" y="270" font-size="24" fill="#fff">EAST</text>
    </a>
  </svg>
</body>
</html>
