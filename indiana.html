<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Indiana | State Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: white;
      margin: 0;
      padding: 2em;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 1em;
      color: #38bdf8;
    }

    .description {
      font-family: 'Inter', sans-serif;
      font-size: 1.1em;
      max-width: 800px;
      margin: 0 auto 2em auto;
      color: #cbd5e1;
      line-height: 1.8;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2em;
      justify-content: center;
    }

    .grid a {
      display: inline-block;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      transition: transform 0.3s ease;
    }

    .grid a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px #38bdf8;
    }

    .grid img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .back-link {
      margin-top: 2em;
      font-family: 'Inter', sans-serif;
      font-size: 1em;
      display: inline-block;
      color: #60a5fa;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Indiana</h1>

  <div class="grid">
     <a href="landscape_photos/landscape42.jpg" target="_blank">
       <img src="landscape_photos/landscape42.jpg">
    </a>
    
    <div class="grid">
     <a href="landscape_photos/landscape43.png" target="_blank">
       <img src="landscape_photos/landscape43.png">
    </a>

    <!-- Repeat for more images -->
  </div>

  <a class="back-link" href="us-map.html">← Back to Landscape Gallery</a>

  <script>
    // Optional: Prevent single click from triggering default action
    document.querySelectorAll('.grid a').forEach(anchor => {
      anchor.addEventListener('click', (e) => e.preventDefault());
      anchor.addEventListener('dblclick', () => {
        window.open(anchor.href, '_blank');
      });
    });
  </script>
</body>
</html>
