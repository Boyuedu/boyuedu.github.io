<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Album | Boyue Du</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: white;
      margin: 0;
      padding: 2em;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 0.5em;
    }

    .description {
      font-family: 'Inter', sans-serif;
      font-size: 1.1em;
      max-width: 800px;
      margin: 0 auto 1em auto;
      color: #cbd5e1;
      line-height: 1.8;
    }

    .instruction {
      font-family: 'Inter', sans-serif;
      font-size: 0.95em;
      color: #94a3b8;
      margin-bottom: 2.5em;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2em;
      justify-content: center;
    }

    .grid video {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #334155;
      transition: transform 0.3s ease;
      cursor: pointer;
      background: #0b1220;
    }

    .grid video:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px #38bdf8;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      padding-top: 5%;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
    }

    .modal-video {
      margin: auto;
      display: block;
      width: min(1000px, 92%);
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 0 30px #38bdf8;
      cursor: default;
    }

    .close-hint {
      font-family: 'Inter', sans-serif;
      color: #94a3b8;
      margin-top: 14px;
      font-size: 0.95em;
    }
  </style>
</head>

<body>
  <h1>Music Cover</h1>

  <div class="description">
    Classics · Jazz · Pop · Rock<br>
    Enjoy Music
  </div>

  <div class="instruction">Double click a video to play in full screen modal</div>

  <div class="grid">
    <!-- ✅ Put your videos here -->
    <video class="thumb" muted playsinline preload="metadata" data-src="music_videos/农夫渔夫.MOV">
      <source src="music_videos/农夫渔夫.MOV" type="video/MOV">
      Your browser does not support the video tag.
    </video>

    <!-- Example for adding another -->
    <!--
    <video class="thumb" muted playsinline preload="metadata" data-src="music_videos/example.mp4">
      <source src="music_videos/example.mp4" type="video/mp4">
    </video>
    -->
  </div>

  <!-- Modal -->
  <div id="modal" class="modal" onclick="closeModal(event)">
    <video id="modal-video" class="modal-video" controls autoplay playsinline></video>
    <div class="close-hint">Click outside the video to close</div>
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalVideo = document.getElementById("modal-video");

    // Double click a thumbnail video to open modal
    document.querySelectorAll('.grid video.thumb').forEach(v => {
      v.ondblclick = () => {
        const src = v.getAttribute('data-src');
        modal.style.display = "block";
        modalVideo.src = src;
        modalVideo.load();
        modalVideo.play().catch(() => {});
      };
    });

    // Close only when clicking the dark background (not the video)
    function closeModal(e) {
      if (e.target === modal) {
        modal.style.display = "none";
        modalVideo.pause();
        modalVideo.removeAttribute("src");
        modalVideo.load();
      }
    }
  </script>
</body>
</html>
