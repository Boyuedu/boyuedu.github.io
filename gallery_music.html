    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: white;
      margin: 0;
      padding: 2em;
      text-align: center;

    h1 {

      margin-bottom: 0.5em;
    }

    .description {
      font-family: 'Inter', sans-serif;
      font-size: 1.1em;
      max-width: 800px;
      margin: 0 auto 1em auto;
      color: #cbd5e1;
      line-height: 1.8;
    }

    .instruction {
      font-family: 'Inter', sans-serif;
      font-size: 0.95em;
      color: #94a3b8;
      margin-bottom: 2.5em;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2em;
      justify-content: center;
    }

    /* Thumbnails */
    .grid img.thumb {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #334155;
      transition: transform 0.3s ease;
      cursor: pointer;
      background: #0b1220;
    }

    .grid img.thumb:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px #38bdf8;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      padding-top: 5%;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
    }

    .modal-frame {
      margin: auto;
      display: block;
      width: min(1000px, 92%);
      height: min(600px, 80vh);
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 30px #38bdf8;
      background: #000;
    }

    .close-hint {
      font-family: 'Inter', sans-serif;
      color: #94a3b8;
      margin-top: 14px;
      font-size: 0.95em;
    }
  </style>
</head>

  <!-- ✅ MODAL -->
  <div id="modal" class="modal" onclick="closeModal(event)">
    <iframe id="modal-frame" class="modal-frame" allow="autoplay"></iframe>
    <div class="close-hint">Click outside the video to close</div>
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalFrame = document.getElementById("modal-frame");

    // Double click a thumbnail image to open modal
    document.querySelectorAll('.grid img.thumb').forEach(img => {
      img.ondblclick = () => {
        const preview = img.getAttribute('data-preview');
        modal.style.display = "block";
        modalFrame.src = preview;
      };
    });

    // Close only when clicking the dark background (not the iframe)
    function closeModal(e) {
      if (e.target === modal) {
        modal.style.display = "none";
        modalFrame.src = "";
      }
    }
  </script>
